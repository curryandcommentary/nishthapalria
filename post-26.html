  .h4d-carousel-wrap {

  .h4d-track {

  .h4d-slide {

</div>
 
<script>
(function () {
  const wrap = document.getElementById("h4diary2");
  const track = wrap.querySelector('.h4d-track');
  const slides = Array.from(track.children);
  const dotsWrap = wrap.querySelector('.h4d-dots');
  const counterText = wrap.querySelector('.h4d-counterText');
  const prevBtn = wrap.querySelector('.h4d-nav-prev');
  const nextBtn = wrap.querySelector('.h4d-nav-next');
  const total = slides.length;
 
  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'h4d-dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    d.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);
 
  function currentIndex() {
    return Math.round(track.scrollLeft / track.clientWidth);
  }
  function updateUI() {
    const idx = Math.min(Math.max(currentIndex(), 0), total - 1);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    counterText.textContent = (idx + 1) + ' / ' + total;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }
  function goTo(i) {
    const clamped = Math.min(Math.max(i, 0), total - 1);
    track.scrollTo({ left: clamped * track.clientWidth, behavior: 'smooth' });
  }
  let t;
  track.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(updateUI, 60); });
  prevBtn.addEventListener('click', () => goTo(currentIndex() - 1));
  nextBtn.addEventListener('click', () => goTo(currentIndex() + 1));
  window.addEventListener('resize', () => goTo(currentIndex()));
  updateUI();
})();
</script>
